<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thamyres Lobo | Pilates e Fisioterapia</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-teal: #78B5A2;
            --primary-dark-teal: #1F6E6D;
            --deep-emerald: #145043;
            --accent-green: #38A169;
            --bg-cream: #F5F9F7;
            --bg-white: #FFFFFF;
            --text-dark: #2C3E35;
            --text-muted: #5A7065;
            --shadow: 0 10px 30px rgba(20, 80, 67, 0.08);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-cream); color: var(--text-dark); line-height: 1.6; overflow-x: hidden; }

        /* HEADER & NAVIGATION */
        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(20, 80, 67, 0.9); backdrop-filter: blur(10px); z-index: 1000; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
        .logo-box { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
        .logo-box img { height: 44px; width: auto; border-radius: 6px; display: block; }

        /* MENU DESKTOP */
        .nav-links { display: flex; list-style: none; gap: 4px; align-items: center; }
        .nav-links a { 
            text-decoration: none; 
            color: #fff; 
            font-weight: 500; 
            font-size: 0.84rem; 
            padding: 8px 10px;
            border-radius: 20px;
            transition: var(--transition);
            white-space: nowrap;
        }
        .nav-links a:hover { color: var(--primary-teal); background: rgba(255, 255, 255, 0.15); }

        /* MENU HAMBÚRGUER (MOBILE) */
        .menu-toggle { display: none; background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 8px; }

        .btn-cta { 
            background: #25D366; 
            color: #fff !important; 
            padding: 10px 18px; 
            border-radius: 30px; 
            font-weight: 600 !important; 
            font-size: 0.88rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            transition: var(--transition); 
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5); background: #22c35e; }

        .btn-secondary { background: transparent; color: #fff !important; border: 2px solid #fff; padding: 12px 26px; border-radius: 30px; font-weight: 600; text-decoration: none; transition: var(--transition); display: inline-flex; align-items: center; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); border-color: var(--primary-teal); }

        /* HERO SECTION */
        .hero { 
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 140px 24px 80px;
            background: linear-gradient(rgba(20, 80, 67, 0.65), rgba(20, 80, 67, 0.75)), url('Pilates.jpeg') no-repeat center center/cover;
            color: #fff;
            text-align: left;
        }
        .hero-container { max-width: 1200px; width: 100%; margin: 0 auto; z-index: 2; }
        .hero-content { max-width: 750px; }
        .hero-content h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; color: #fff; line-height: 1.2; margin-bottom: 20px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .hero-content p { font-size: 1.2rem; color: rgba(255, 255, 255, 0.9); margin-bottom: 35px; text-shadow: 0 1px 5px rgba(0,0,0,0.3); }

        /* DIVISOR DISCRETO */
        .section-divider {
            max-width: 1200px;
            margin: 0 auto;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(120, 181, 162, 0.35) 50%, transparent 100%);
            position: relative;
        }
        .section-divider::after {
            content: '•';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: inherit;
            color: var(--primary-dark-teal);
            font-size: 1.2rem;
            padding: 0 15px;
            opacity: 0.6;
        }

        /* SECTIONS & TÍTULOS */
        .section { padding: 80px 24px; }
        .section-title { text-align: center; max-width: 700px; margin: 0 auto 50px; }
        .section-title h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--deep-emerald); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .section-title h2 i { color: var(--primary-dark-teal); font-size: 1.8rem; }
        .section-title p { color: var(--text-muted); font-size: 1.05rem; }

        /* SERVIÇOS */
        .services-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .service-card { background: var(--bg-white); padding: 40px 32px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid rgba(120, 181, 162, 0.25); border-top: 5px solid var(--primary-dark-teal); transition: var(--transition); display: flex; flex-direction: column; }
        .service-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(20, 80, 67, 0.12); }
        .service-icon { width: 54px; height: 54px; background: rgba(120, 181, 162, 0.15); color: var(--primary-dark-teal); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 22px; transition: var(--transition); }
        .service-card:hover .service-icon { background: var(--primary-dark-teal); color: #fff; transform: scale(1.05); }
        .service-card h3 { font-family: 'Playfair Display', serif; font-size: 1.35rem; color: var(--deep-emerald); margin-bottom: 14px; line-height: 1.35; }
        .service-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 0; line-height: 1.6; }

        /* SEÇÃO QUEM SOMOS */
        .about-section { background: var(--bg-white); }
        .about-box { max-width: 1200px; margin: 0 auto; background: linear-gradient(135deg, rgba(120, 181, 162, 0.12) 0%, rgba(245, 249, 247, 0.8) 100%); border: 1px solid rgba(120, 181, 162, 0.3); border-radius: 28px; padding: 50px 40px; box-shadow: var(--shadow); }
        .about-manifesto { text-align: center; max-width: 850px; margin: 0 auto 35px; }
        .about-manifesto h3 { font-family: 'Playfair Display', serif; font-size: 1.55rem; color: var(--deep-emerald); margin-bottom: 14px; line-height: 1.4; }
        .about-manifesto p { font-size: 1.05rem; color: var(--text-dark); line-height: 1.8; }

        /* ESTATÍSTICAS */
        .stats-inline { display: flex; justify-content: center; align-items: center; gap: 40px; flex-wrap: wrap; margin-bottom: 45px; }
        .stat-item { text-align: center; padding: 0 15px; }
        .stat-number { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 700; color: var(--primary-dark-teal); line-height: 1; }
        .stat-desc { font-size: 0.88rem; font-weight: 600; color: var(--text-muted); margin-top: 6px; }
        .stat-divider { width: 1px; height: 40px; background: rgba(120, 181, 162, 0.35); }

        .team-highlights { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .team-card { background: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 6px 20px rgba(20, 80, 67, 0.05); border: 1px solid rgba(120, 181, 162, 0.25); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; display: flex; flex-direction: column; }
        .team-card:hover { transform: translateY(-6px); box-shadow: 0 16px 35px rgba(20, 80, 67, 0.12); }
        .team-avatar { width: 100%; height: 380px; object-fit: cover; display: block; }
        .avatar-thamyres { object-position: center 70%; }
        .avatar-micaelly { object-position: center top !important; }
        .team-info { padding: 28px 24px; }
        .team-card h4 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--deep-emerald); margin-bottom: 4px; }
        .team-card span { font-size: 0.82rem; font-weight: 600; color: var(--primary-dark-teal); text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 14px; }
        .team-card p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0; line-height: 1.6; }

        /* GALERIA DO STUDIO */
        .gallery-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .gallery-card { background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 25px rgba(20, 80, 67, 0.08); border: 2px solid rgba(120, 181, 162, 0.35); transition: var(--transition); position: relative; }
        .gallery-card:hover { transform: translateY(-8px); box-shadow: 0 18px 40px rgba(20, 80, 67, 0.18); border-color: var(--primary-dark-teal); }
        .img-container { position: relative; overflow: hidden; }
        .gallery-card img { width: 100%; height: 270px; object-fit: cover; display: block; transition: transform 0.5s ease; cursor: pointer; }
        .gallery-card:hover img { transform: scale(1.05); }
        .zoom-badge { position: absolute; top: 15px; right: 15px; background: rgba(20, 80, 67, 0.82); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(4px); pointer-events: none; transition: var(--transition); }
        .gallery-card:hover .zoom-badge { background: var(--primary-dark-teal); transform: scale(1.05); }
        .gallery-caption { padding: 22px 24px; background: #fff; }
        .gallery-caption h4 { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--deep-emerald); margin-bottom: 6px; }
        .gallery-caption p { font-size: 0.9rem; color: var(--text-muted); }

        /* CURIOSIDADES GRID */
        .curiosidades-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
        .curiosidade-card { background: var(--bg-white); padding: 35px 28px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid rgba(120, 181, 162, 0.3); transition: var(--transition); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .curiosidade-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, var(--primary-teal), var(--primary-dark-teal)); }
        .curiosidade-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(20, 80, 67, 0.15); border-color: var(--primary-dark-teal); }
        .curiosidade-icon { width: 60px; height: 60px; background: rgba(120, 181, 162, 0.15); color: var(--primary-dark-teal); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 22px; transition: var(--transition); }
        .curiosidade-card:hover .curiosidade-icon { background: var(--primary-dark-teal); color: #fff; transform: scale(1.1) rotate(5deg); }
        .curiosidade-card h3 { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--deep-emerald); margin-bottom: 12px; line-height: 1.35; }
        .curiosidade-card p { color: var(--text-muted); font-size: 0.93rem; line-height: 1.6; }

        /* FAQ */
        .faq-container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        .faq-item { background: var(--bg-white); border: 1px solid rgba(120, 181, 162, 0.3); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(20, 80, 67, 0.04); transition: var(--transition); }
        .faq-question { padding: 22px 28px; font-weight: 600; font-size: 1.05rem; color: var(--deep-emerald); display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; gap: 10px; }
        .faq-question i { color: var(--primary-dark-teal); transition: transform 0.3s ease; flex-shrink: 0; }
        .faq-item.active .faq-question i { transform: rotate(180deg); }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; padding: 0 28px; color: var(--text-muted); font-size: 0.98rem; line-height: 1.7; }
        .faq-item.active .faq-answer { max-height: 300px; padding: 0 28px 22px 28px; }

        /* LOCALIZAÇÃO */
        .map-container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid rgba(120, 181, 162, 0.3); display: grid; grid-template-columns: 1fr 1.5fr; }
        .map-info { padding: 40px; display: flex; flex-direction: column; justify-content: center; background: linear-gradient(135deg, rgba(120, 181, 162, 0.08) 0%, rgba(245, 249, 247, 0.5) 100%); }
        .map-info h3 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--deep-emerald); margin-bottom: 12px; }
        .map-info p { color: var(--text-muted); font-size: 0.98rem; margin-bottom: 24px; }
        .map-address-card { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 28px; }
        .map-address-card i { font-size: 1.4rem; color: #E53E3E; background: rgba(229, 62, 62, 0.12); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .map-iframe-box { width: 100%; height: 100%; min-height: 380px; }
        .map-iframe-box iframe { width: 100%; height: 100%; border: none; display: block; }

        /* MODAL */
        .image-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px; }
        .image-modal.active { display: flex; }
        .modal-content { max-width: 90%; max-height: 85vh; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); object-fit: contain; animation: zoomIn 0.3s ease; }
        .close-modal { position: absolute; top: 25px; right: 35px; color: #fff; font-size: 2.5rem; font-weight: bold; cursor: pointer; transition: color 0.2s ease; }
        .close-modal:hover { color: var(--primary-teal); }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* CONTATO */
        .contact-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .contact-info { background: #fff; padding: 40px; border-radius: 20px; box-shadow: var(--shadow); }
        .info-item { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 24px; }
        .info-item .icon-bg { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0; transition: var(--transition); }
        .icon-map { background: rgba(229, 62, 62, 0.12); color: #E53E3E; }
        .icon-whatsapp { background: rgba(37, 211, 102, 0.15); color: #25D366; }
        .icon-instagram { background: rgba(225, 48, 108, 0.12); color: #E1306C; }
        .icon-clock { background: rgba(214, 158, 46, 0.15); color: #D69E2E; }
        .info-item:hover .icon-bg { transform: scale(1.08); }

        /* CTA BOX */
        .cta-box { background: linear-gradient(135deg, var(--deep-emerald), var(--primary-dark-teal)); padding: 42px 36px; border-radius: 24px; color: #fff; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 15px 35px rgba(20, 80, 67, 0.18); border: 1px solid rgba(255, 255, 255, 0.15); }
        .cta-box h3 { font-family: 'Playfair Display', serif; font-size: 1.85rem; line-height: 1.3; margin-bottom: 12px; }
        .cta-box p { font-size: 0.98rem; opacity: 0.9; margin-bottom: 20px; }
        .cta-benefits { list-style: none; margin-bottom: 28px; }
        .cta-benefits li { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; margin-bottom: 10px; font-weight: 500; }
        .cta-benefits li i { color: #25D366; font-size: 1.1rem; }
        .btn-whatsapp { background: #25D366; color: #fff; padding: 15px 30px; border-radius: 30px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 12px; font-size: 1.05rem; box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35); transition: var(--transition); width: fit-content; }
        .btn-whatsapp:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5); background: #22c35e; }
        .cta-note { margin-top: 14px; font-size: 0.82rem; opacity: 0.75; display: flex; align-items: center; gap: 6px; }

        footer { background: var(--deep-emerald); color: #fff; text-align: center; padding: 25px 24px; font-size: 0.88rem; }

        /* ==========================================
           WIDGET CHATBOT FLUTUANTE, BALÃO & PULSE
           ========================================== */
        @keyframes greenPulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.8); }
            70% { box-shadow: 0 0 0 18px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        @keyframes floatBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes pointingHand {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }

        .chat-widget-wrapper {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1500;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* BALÃO DE FALA ESTILO ANEXO (LAYOUT CARD VERDE) */
        .chat-speech-bubble {
            background: #ffffff;
            color: var(--text-dark);
            padding: 22px 22px 18px;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(20, 80, 67, 0.16);
            border: 1px solid rgba(120, 181, 162, 0.35);
            margin-bottom: 16px;
            width: 320px;
            max-width: calc(100vw - 60px);
            position: relative;
            cursor: pointer;
            animation: floatBounce 3.5s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .chat-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 32px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #ffffff;
        }

        .bubble-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
        }

        .bubble-title-box h3 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .bubble-title-box h3 .highlight-name {
            color: var(--primary-dark-teal);
            font-weight: 800;
        }

        .bubble-title-box p {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .bubble-close-btn {
            background: rgba(120, 181, 162, 0.15);
            color: var(--primary-dark-teal);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            flex-shrink: 0;
        }

        .bubble-close-btn:hover {
            background: #E53E3E;
            color: #fff;
        }

        /* PILL BUTTON INTERNO DO BALÃO */
        .bubble-cta-pill {
            background: rgba(120, 181, 162, 0.15);
            color: var(--primary-dark-teal);
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.88rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            border: 1px solid rgba(120, 181, 162, 0.3);
        }

        .chat-speech-bubble:hover .bubble-cta-pill {
            background: var(--primary-dark-teal);
            color: #ffffff;
